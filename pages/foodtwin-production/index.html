<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodTwin Production Tool</title>
    <link rel="shortcut icon" type="image/ico" href="https://s3.us-east-2.amazonaws.com/stories2.theplotline.org/favicon.ico" />
    
    <!-- Mapbox GL JS -->
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.css" rel="stylesheet" />
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.js"></script>
    
    <!-- Bootstrap + Bootswatch Lux Theme -->
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5/dist/cosmo/bootstrap.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Chart.js for data visualizations -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
    
    <!-- Custom styles -->
    <link href="./style.css" rel="stylesheet" />
</head>
<body>
    <div class="app-container">
        <!-- Dashboard Panel (25%) -->
        <div class="dashboard-panel">
            <div class="dashboard-header">
                <h4 class="mb-0">FoodTwin Dashboard</h4>
                <p class="text-muted small mb-0">Production Analysis Tool</p>
            </div>
            
            <div class="dashboard-content">
                <!-- Infrastructure Heatmap Section -->
                <div class="visualization-section">
                    <h6 class="section-title">Infrastructure Analysis</h6>
                    
                    <!-- Metric Selector -->
                    <div class="metric-selector mb-3">
                        <label for="metricSelect" class="form-label small">Visualize by:</label>
                        <select class="form-select form-select-sm" id="metricSelect">
                            <option value="Energy (kcal)" selected>Energy (kcal)</option>
                            <option value="Protein (kg)">Protein (kg)</option>
                            <option value="Fat (kg)">Fat (kg)</option>
                            <option value="Carbs (kg)">Carbohydrates (kg)</option>
                            <option value="Fiber (kg)">Fiber (kg)</option>
                            <option value="Beta-carotene (mg)">Beta-carotene (mg)</option>
                            <option value="Calcium (g)">Calcium (g)</option>
                            <option value="Iron (g)">Iron (g)</option>
                            <option value="Magnesium (g)">Magnesium (g)</option>
                            <option value="Phosphorus (g)">Phosphorus (g)</option>
                            <option value="Potassium (g)">Potassium (g)</option>
                            <option value="Riboflavin (g)">Riboflavin (g)</option>
                            <option value="Selenium (mg)">Selenium (mg)</option>
                            <option value="Thiamin (g)">Thiamin (g)</option>
                            <option value="VitaminA (mg)">Vitamin A (mg)</option>
                            <option value="VitaminB12 (mg)">Vitamin B12 (mg)</option>
                            <option value="VitaminB6 (g)">Vitamin B6 (g)</option>
                            <option value="VitaminC (g)">Vitamin C (g)</option>
                            <option value="Zinc (g)">Zinc (g)</option>
                        </select>
                    </div>
                    
                    <div class="heatmap-container">
                        <!-- Tab Navigation -->
                        <ul class="nav nav-tabs nav-tabs-sm mb-3" id="infrastructureTabs" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active" id="maritime-tab" data-bs-toggle="tab" data-bs-target="#maritime" type="button" role="tab" aria-controls="maritime" aria-selected="true">Maritime</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" id="rail-tab" data-bs-toggle="tab" data-bs-target="#rail" type="button" role="tab" aria-controls="rail" aria-selected="false">Rail</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" id="roads-tab" data-bs-toggle="tab" data-bs-target="#roads" type="button" role="tab" aria-controls="roads" aria-selected="false">Roads</button>
                            </li>
                        </ul>
                        
                        <!-- Tab Content -->
                        <div class="tab-content" id="infrastructureTabContent">
                            <div class="tab-pane fade show active" id="maritime" role="tabpanel" aria-labelledby="maritime-tab">
                                <div class="heatmap-grid" id="maritimeHeatmap"></div>
                            </div>
                            <div class="tab-pane fade" id="rail" role="tabpanel" aria-labelledby="rail-tab">
                                <div class="heatmap-grid" id="railHeatmap"></div>
                            </div>
                            <div class="tab-pane fade" id="roads" role="tabpanel" aria-labelledby="roads-tab">
                                <div class="heatmap-grid" id="roadsHeatmap"></div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Info Panel -->
                <div class="info-section">
                    <h6 class="section-title">Selected Region</h6>
                    <div id="regionInfo" class="info-content">
                        <p class="text-muted small">Click on the map to view regional data</p>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Map Panel (75%) -->
        <div class="map-panel">
            <div id="map"></div>
        </div>
    </div>
    
    <script src="./main.js"></script>
</body>
</html>
